[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fannar"
version = "0.3.0"
description = "Representation spaces of trained models from Gram matrices of several sources (kernel-transformation pipeline, Hadamard composition, geometry and spectral energy)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Fernando C. S. Dal' Maria" },
  { name = "Cristiane N. Nobre" },
  { name = "Pedro Belchior" },
]
keywords = ["interpretability", "explainability", "kernel methods", "RKHS", "Gram matrix", "representation geometry"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23", "matplotlib>=3.6"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
sklearn = ["scikit-learn>=1.2"]
pandas = ["pandas>=1.5"]
all = ["torch>=2.0", "scikit-learn>=1.2", "pandas>=1.5"]
test = ["pytest>=7", "scikit-learn>=1.2", "pandas>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
