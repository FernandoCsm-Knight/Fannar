[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fannar"
version = "0.1.0"
description = "Interpretabilidade geométrica de modelos de IA via RKHS, produto tensorial e energia espectral."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fannar" }]
keywords = ["interpretability", "rkhs", "kernels", "pytorch", "spectral", "geometry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch>=2.12.0",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "plotly>=5.0"]
sci = ["scipy>=1.10", "scikit-learn>=1.2"]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.155.2",
    "mypy>=2.1.0",
]
all = ["fannar[viz,sci,dev]"]

[project.urls]
Homepage = "https://example.com/fannar"
Repository = "https://example.com/fannar"

[tool.hatch.build.targets.wheel]
packages = ["src/fannar"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/fannar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["fannar"]
branch = true
